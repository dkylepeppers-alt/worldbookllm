<script type="application/json" id="story-json">{"inkVersion":21,"root":[["#","^title: The Salt Ledger","/#","#","^ifid: 82B423F3-CE69-440E-931C-A18561A56CA1","/#",{"->":"chapter_01"},"\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n","\n",["done",{"#f":5,"#n":"g-0"}],null],"done",{"chapter_01":[["#","^chapter: The Margery Lane","/#","^The Customs House of Harrowmere kept its books the way the sea kept its dead: patiently, and with no intention of giving anything back.","\n","^Wren Adair had been a junior clerk there for three years, long enough to know that the year-end reconciliation was not work anyone wanted. Every ship that came into the harbor paid the salt tithe, a duty weighed against its cargo and recorded in the Salt Ledger under the seal of the assessor who had cleared it. At the turn of the year, someone had to walk the ledger back through every quarter, page by page, and make sure that what the Customs House had been paid matched what it had written down. This year, as in the two before it, that someone was Wren.","\n","^She did not mind as much as the others thought she should. The ledger room was on the top floor, under the slates, and in the evenings the only sound was the harbor bell counting the tide. She liked the columns. She liked that a column either added up or it did not, and that when it did not, there was a reason, and the reason was written down somewhere if you were willing to look.","\n","^By the third night she had reached the merchant hulls registered before the war. Most of them were long gone, broken up for timber or sold south, their entries ending in the same faded line: _Struck from the register._ She turned the pages quickly, running her finger down the margin, until the finger stopped on its own.","\n","^_Margery Lane. Brigantine, two masts. Master: O. Cask. Tithe assessed and paid in full._","\n","^The date beside it was the first day of the autumn quarter. This autumn. Seven weeks ago.","\n","^Wren knew the _Margery Lane_. Everyone in Harrowmere did. Nineteen years ago she had gone out past the Teeth in a squall with eleven men aboard and a hold full of copper, and the Teeth had kept her. There was a plaque about it on the harbor wall. Wren's father had taken her to see it when she was small, and had told her that this was what the sea did to people who were in a hurry.","\n","^She turned back a page, then another. The _Margery Lane_ had paid its tithe in the summer quarter. And the spring. And the winter before that. She kept turning, faster now, the paper cold and slightly damp under her hands, until the ledger gave out and she had to fetch the previous volume from the shelf, and then the one before that. The entries went back without a break. Every quarter for nineteen years, a ship at the bottom of the sea had paid its taxes on time.","\n","^Every entry carried the same seal: a pressed circle of grey wax, and inside it a heron standing on one leg.","\n","^Wren sat back. The chair creaked. Below her, the bell rang the turn of the tide, and the sound went on longer than it should have in the empty room.","\n","^She knew the heron. It was on the ring Master Assessor Ilse Varga wore on her right hand, the hand she used to point out mistakes.","\n","#","^break","/#","^Ilse Varga had cleared more cargo than anyone in the Customs House, and she had never, in Wren's hearing, raised her voice. She did not need to. She had a way of reading a column of figures aloud, slowly, that made the clerk who had written it wish they had chosen another trade. When Wren had first come to the Customs House, sixteen and trying not to look it, it was Varga who had taken her ledger, read it through in silence, and handed it back with a single correction in the margin and the words: _You see what others skim. Don't stop._","\n","^Wren had kept that page. It was in the drawer of her desk downstairs, under the spare nibs.","\n","^She made herself go slowly. A seal could be copied. A clerk could have used the wrong ring, or pressed an old impression into new wax, or simply carried a line forward from one quarter to the next without thinking, the way tired people did. She checked the hand. The entries were not all in one hand; they were in the hand of whichever clerk had been on the tithe desk that quarter, including, two years ago, her own.","\n","^Wren stared at that one for a long time. She did not remember writing it. She remembered the quarter, the fog that had sat on the harbor for a week, the crates of salt cod stacked to the rafters of the weighing shed. She did not remember the _Margery Lane_. But it was her hand, her slanted sevens, her habit of crossing the double-l in _full_ as if it were a t. Someone had brought her a docket with the heron seal already on it, and she had copied it into the ledger along with forty others, and thought nothing of it.","\n","^The money was real. She checked that too. Every payment had gone into the harbor account, and the harbor account balanced, as it always did. Whatever the _Margery Lane_ was, it was not a theft from the Customs House. If anything, the Customs House had been paid for something that did not exist.","\n","^Or for something that did, under a name that no one would ever look at twice.","\n","^She copied the entries onto a loose sheet, the dates and amounts and the names of the clerks, her own included, and folded the sheet into her coat. Then she put the volumes back on the shelf in the order she had found them, and stood for a while with her hand on their spines, listening to the harbor.","\n","#","^break","/#","^There was one more thing to check, and it was not in the ledger room.","\n","^Every tithe began with a docket: a slip written on the quay by the weigher who had measured the cargo, signed by the ship's master, and brought up to the tithe desk to be copied and sealed. The dockets were kept in the cellars, in boxes by year, and nobody had looked at them since they were filed. Wren took a lamp and went down.","\n","^The cellar smelled of brine and old paper. The boxes went back further than the ledgers did, and some had swollen and split where the high tides came in under the foundations. She found the current year's box easily enough and began to go through the autumn quarter.","\n","^The _Margery Lane_'s docket was near the bottom. It was on the same cheap grey paper as all the others, written in a weigher's careful capitals. _Copper ingot, forty hundredweight. Berth nine._ The master's signature was a single looping _Cask_. The heron seal sat in the corner, crisp and fresh.","\n","^Underneath, in a different hand, someone had written a line in pencil that did not belong on a tithe docket at all:","\n","^_Tell O. the lamp is lit._","\n","^Wren read it three times. Berth nine was at the far end of the north quay, past the fish market, where the Tidewardens kept their boats. The Tidewardens were the harbor pilots, the men and women who brought ships in past the Teeth, and they were older than the Customs House and did not much care for it. Nobody brought a ship into Harrowmere without a Tideward at the wheel. Nobody, as far as Wren knew, had ever brought one in to berth nine.","\n","^She was reaching for the previous year's box when she heard the cellar door open at the top of the stairs.","\n","#","^break","/#","^She knew the step before she saw the lamp. Unhurried, even, a little heavier on the left foot.","\n","^\"Miss Adair,\" said Ilse Varga. \"You're working late.\"","\n","^Wren turned. The Master Assessor stood on the bottom stair with her lamp held low, so that it lit the floor between them and not much else. She wore her grey coat buttoned to the throat, as she always did, and the heron ring caught the light on her right hand.","\n","^\"The reconciliation,\" Wren said. Her voice came out steadier than she expected. \"I'm behind.\"","\n","^\"You're never behind.\" Varga came down the last step. Her eyes went to the open box, and then to the docket in Wren's hand, and stayed there. For a moment the cellar was quiet enough that Wren could hear the water moving under the floor.","\n","^\"I wondered who it would be,\" Varga said at last. \"I thought, once, that it might be you.\"","\n","^\"Then you know what I found.\"","\n","^\"I know what you think you found.\" Varga set her lamp down on a crate. In its light she looked tired, and older than she had looked upstairs, and not at all surprised. \"Nineteen years, Wren. Do you know how many clerks have sat at that desk in nineteen years? Every one of them copied that line. Not one of them asked.\"","\n","^\"Who is O.?\"","\n","^Varga did not answer. She looked at the pencilled line on the docket for a long moment, and when she spoke again her voice was very quiet.","\n","^\"There is a ship coming in on tomorrow night's tide,\" she said. \"It will berth where it always berths, and it will pay what it always pays, and in the morning the ledger will balance. That is all that happens, if you let it. You may think about what happens if you don't.\"","\n","^She picked up her lamp and turned back to the stairs. On the first step she paused, without looking round.","\n","^\"Put the box back where you found it. The tide comes in under that wall.\"","\n","^Then she was gone, and Wren stood alone in the cellar with the docket in her hand, the water whispering under the floor, and the harbor bell beginning, far above her, to count the turn of the tide.","\n","ev","str","^Take the docket and leave","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Put it back and keep searching","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Burn the docket in the lamp","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["\n","ev",{"VAR?":"salt_ledger_gap"},1,"+",{"VAR=":"salt_ledger_gap","re":true},"/ev",{"->":"chapter_02"},{"#f":5}],"c-1":["\n","ev",{"VAR?":"varga_relief"},1,"+",{"VAR=":"varga_relief","re":true},"/ev",{"->":"chapter_03"},{"#f":5}],"c-2":["\n","ev",{"VAR?":"clerks_who_copied"},1,"+",{"VAR=":"clerks_who_copied","re":true},"/ev","ev",0,"/ev",{"VAR=":"salt_ledger_gap","re":true},{"->":"chapter_04"},{"#f":5}]}],{"#f":1}],"chapter_02":[["#","^chapter: The Copying","/#","^Wren folded the docket into her coat with the copied sheet, her fingers clumsy with hurry. The cellar box gaped open, one file fewer than it should hold, and she did not have time to rearrange the rest to hide the absence. She blew out her lamp and took the stairs two at a time, her boots loud on the stone, emerging into the corridor just as the watchman's bell rang the quarter-hour somewhere above.","\n","^The ledger room was dark. She had left it that way, but now the darkness felt different—like a held breath. She relit her lamp from the corridor sconce and shut the door behind her, sliding the bolt with a click that seemed to carry through the whole floor.","\n","^She had the docket. She had her own copied sheet. What she did not have was enough.","\n","^The volumes stood on their shelf in the order she had left them. Wren pulled down the first of the nineteen years and opened it on the desk, her lamp turned low. The pages were cold and slightly stiff, the ink faded to brown in the older entries. She found the first _Margery Lane_ line—spring quarter, nineteen years ago, in a clerk's hand she did not recognize, the heron seal already crisp and new—and copied it onto a second loose sheet. Then the next quarter. Then the next. The names of the clerks changed as the years turned, a roster of the Customs House's forgotten juniors, each one copying the line without asking, each seal placed by the same hand that wore the heron ring.","\n","^Her own name appeared on the eighth sheet. She copied it anyway, her pen moving steadily, as if the act of transcription could separate her from the girl who had written the original.","\n","^The harbor bell rang once, twice, three times. She had lost count of the quarters. Her hand ached. The pile of copied sheets grew, each one a quarter-year of a ship that did not exist, and beneath her coat the docket pressed against her ribs like a second heartbeat.","\n","^A floorboard creaked in the corridor outside.","\n","^Wren held her breath. The sound did not repeat, but she knew the watchman's rounds: up the main stair, along the corridor past the assessors' offices, then the back stair down to the cellars. She had perhaps ten minutes if he was running late, five if he was not. The current volume was still open on the desk, her pen uncapped, the copied sheets scattered where she had set them to dry.","\n","^She could stay and finish what she had started. She could gather what she already had and trust the partial record to be enough. Or she could find some corner of the room to hide it all, leave with nothing in her hands, and hope that empty hands looked like innocence if the watchman turned his lamp her way.","\n","ev","str","^Copy every quarter before leaving","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Gather what she has and go","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Hide it in the wall and walk out","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["\n","ev",2,"/ev",{"VAR=":"salt_ledger_gap","re":true},"ev",{"VAR?":"weigher_attention"},1,"+",{"VAR=":"weigher_attention","re":true},"/ev",{"->":"chapter_05"},{"#f":5}],"c-1":["\n","ev",1,"/ev",{"VAR=":"salt_ledger_gap","re":true},{"->":"chapter_06"},{"#f":5}],"c-2":["\n","ev",1,"/ev",{"VAR=":"salt_ledger_gap","re":true},{"->":"chapter_07"},{"#f":5}]}],{"#f":1}],"chapter_03":[["#","^chapter: The Same Lie, Told the Same Way","/#","^Wren slid the docket between its neighbors and closed the box. The wood scraped softly against the shelf. She stood for a moment with her palm flat on the lid, feeling the grain, as if the box might tell her something the papers inside would not.","\n","^Then she reached for the one beside it.","\n","^The previous year's box was heavier, dark with tide-stains along the bottom. She lifted the lid and went through the quarters in order. The _Margery Lane_ docket was in each one, always near the bottom, always on the same cheap grey paper. _Copper ingot, forty hundredweight. Berth nine._ The weigher's capitals changed with the years — one hand cramped and careful, another loose and slanted, a third that looked like her own supervisor's — but the master's signature did not. It was always the same single looping _Cask_, as if one man had sat down in a quiet room and signed them all at once.","\n","^She kept going. The boxes grew lighter as the years retreated, the paper inside stiffening with salt. In the eighth year back she found the first pencilled message: _Tell O. the lamp is lit._ In the fifth year it was there again, in the third, the seventh — not every quarter, but often enough to be part of the arrangement. A signal. A code that had outlived the men who first wrote it down.","\n","^Nineteen years back, the first box. The wood was pale, barely stained, and when she opened it the dockets smelled of fresh ink and nothing else. The _Margery Lane_'s first entry sat at the top of the autumn quarter, not hidden at the bottom where later clerks had tucked it. The heron seal was pressed deep into grey wax, the bird's lines sharp enough to cut a finger. The cargo was the same. The berth was the same. The signature was the same.","\n","^Wren sat back on her heels. The cellar was cold, and her lamp was burning low. Seventy-six quarters, she counted. Seventy-six times a weigher had written those capitals, a clerk had copied them, an assessor had sealed them. Seventy-six times the harbor account had swallowed money for a ship that was already at the bottom of the Teeth.","\n","^She had done as Varga asked. The docket was back in its box, the box on its shelf, and the shelf held nineteen years of the same lie, told the same way, by hands that changed while the signature stayed still.","\n","^The water moved under the floor, restless, patient. Wren blew out her lamp and climbed the stairs in darkness, her fingers finding the gaps between the stones. The corridor above was empty. The watchman's bell had rung while she was below, and rung again, and she had not heard it.","\n","^She stepped out of the Customs House into a fog that had come in off the harbor while she worked. The plaque on the harbor wall was somewhere in that grey, eleven names she could not read from here. Tomorrow night the tide would bring the ship, or whatever moved under that dead name, into berth nine.","\n","^Wren stood on the step with the fog clinging to her coat. She had understanding now, wide and deep as the harbor itself, and nothing she could set on a desk to prove it.","\n","ev","str","^Walk to berth nine in the fog","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Go home and write it down","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Knock on Varga's office door","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["\n","ev",{"VAR?":"tidewarden_lamp"},1,"+",{"VAR=":"tidewarden_lamp","re":true},"/ev",{"->":"chapter_08"},{"#f":5}],"c-1":["\n","ev",{"VAR?":"clerks_who_copied"},1,"+",{"VAR=":"clerks_who_copied","re":true},"/ev",{"->":"chapter_09"},{"#f":5}],"c-2":["\n","ev",{"VAR?":"varga_relief"},1,"+",{"VAR=":"varga_relief","re":true},"/ev",{"->":"chapter_10"},{"#f":5}]}],{"#f":1}],"chapter_04":[["#","^chapter: The Burning","/#","^The flame took the corner first. The cheap grey paper curled inward, the weigher's careful capitals blackening, the looping _Cask_ shrinking to a thread of ash. The pencilled message went last — _Tell O. the lamp is lit_ — the graphite flaring blue-white for an instant before there was nothing but char in the lamp's dish and the smell of burned paper mixing with the cellar's brine.","\n","^Wren watched it finish. Then she tipped the lamp's dish into the water that seeped along the wall, and the last of the docket hissed away.","\n","^She climbed the stairs with the lamp in one hand and her copied sheet in the other. The corridor was empty; the watchman's bell had rung somewhere above while she was below, and the silence that followed seemed to wait for her to fill it. She did not. She walked to her desk on the clerks' floor and sat in the dark with the sheet unfolded before her, the dates and amounts and names — her own among them — pale in the light from the corridor sconce.","\n","^She had told herself it was necessary. The docket was a single point of failure, a piece of paper that could be found in her coat, that could send her to the cells or worse, that Varga had seen her holding. Without it, she was only a girl with a copied sheet and a suspicion. She was safe, the way nineteen years of clerks had been safe, the way she had been safe two years ago when she copied the line without asking and thought nothing of it.","\n","^But the copied sheet was still in her hand. The names were still in her handwriting. And somewhere in the ledger room above, her slanted sevens and crossed double-l's sat in the autumn quarter of two years past, part of the same lie she had just fed to the flame.","\n","^She sat for a long time, listening to the harbor bell count the tide. The sheet was warm from her pocket, as if the fire had travelled there. Tomorrow night the ship would come in, or something would, and the ledger would balance, and she would be — what? Another clerk who had seen and done nothing? Or something else, something she did not yet have a name for?","\n","^The lamp on her desk was cold. She had not lit it. She sat in the dark with the copied sheet and the knowledge that she had chosen once, and would have to choose again.","\n","ev","str","^Go to the harbor wall","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Walk to berth nine","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Knock on Varga's door","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["\n","ev",{"VAR?":"harrowmere_plaque"},1,"+",{"VAR=":"harrowmere_plaque","re":true},"/ev",{"->":"chapter_11"},{"#f":5}],"c-1":["\n","ev",{"VAR?":"tidewarden_lamp"},1,"+",{"VAR=":"tidewarden_lamp","re":true},"/ev",{"->":"chapter_12"},{"#f":5}],"c-2":["\n","ev",{"VAR?":"varga_relief"},1,"+",{"VAR=":"varga_relief","re":true},"/ev",{"->":"chapter_13"},{"#f":5}]}],{"#f":1}],"chapter_05":[["#","^chapter: The Complete Record","/#","^Wren's pen did not stop. The floorboard creaked again, closer this time, a heavy tread measured and regular — the watchman's boots, not Varga's lighter step. She copied the winter quarter of the third year back, the clerk's name smeared where damp had got at the page, and moved to the next volume without looking up.","\n","^The sheets covered the desk now, a fan of grey paper each bearing the same lie in a different hand. Her own name appeared twice more as she worked, years she did not remember, fog quarters and summer quarters, her slanted sevens marching across the page in service of a ship that had never come in. She copied them too. The act had become something beyond evidence-gathering: a penance, an accounting, a refusal to let any of it stay hidden.","\n","^The footsteps stopped outside the door.","\n","^Wren held her breath. The bolt was shot; she had shot it herself, but the watchman had keys to every door in the Customs House. She heard the jingle of the ring, the scrape of iron in the lock, and then silence — a long pause in which she could hear her own heartbeat and the harbor bell marking some fraction of the tide she had lost track of.","\n","^The lock did not turn. Perhaps he was listening. Perhaps he had already heard the scratch of her pen through the wood and was waiting to see if the sound would repeat. Wren sat perfectly still, the uncapped pen drying in her fingers, the open ledger before her a confession in plain sight.","\n","^The footsteps moved on. Not toward the stairs — toward the assessors' offices, the other wing, his rounds continuing in their ordained pattern. She had minutes, perhaps less.","\n","^She wrote faster. The last three years, the last two, the final quarter that brought her to the autumn docket already folded in her coat. She did not stop to read what she copied. The names of the clerks blurred together, a nineteen-year procession of juniors who had sat where she sat and seen what she saw and written the line and thought nothing of it. She was finishing the last sheet when she heard the watchman's bell ring the three-quarter hour from the floor below.","\n","^She had the complete record. Seventy-six quarters, seventy-six entries, seventy-six heron seals in grey wax. The sheets would not fold small; she had to roll them and tie them with the cord from the blotter, a cylinder of paper thick as her wrist. The docket joined them, the pencilled message _Tell O. the lamp is lit_ pressed against the copied names of clerks long gone.","\n","^The harbor-side door was her only way out. The main stairs would take her past the watchman's station; the back stairs led down to the cellars where Varga had found her once already. The fog had come in while she worked, swallowing the lamps of the lower harbor. She stood with the roll of paper in her hands and the door before her, the bolt already drawn back, and knew that whatever she did next would not be undone.","\n","^The roll was heavy. It contained every quarter of the lie, her own hand among them, the heron seal repeated like a pulse. She could carry it out into the fog and let the harbor decide what she was. She could hide it in the wall cavity where old heating pipes had left a space behind the wainscoting, and leave with empty hands that knew where the truth waited. Or she could set it down on the desk, open to the page where her own name appeared, and sit in the lamplight until the watchman's key turned in the lock and someone official had to say, out loud, what happened to clerks who asked what the sea had kept.","\n","ev","str","^Take the roll and go out the harbor door","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Hide the roll in the wall cavity and slip away","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Sit at the desk and wait to be found","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["\n","ev",2,"/ev",{"VAR=":"salt_ledger_gap","re":true},"ev",{"VAR?":"weigher_attention"},1,"+",{"VAR=":"weigher_attention","re":true},"/ev",{"->":"chapter_14"},{"#f":5}],"c-1":["\n","ev",2,"/ev",{"VAR=":"salt_ledger_gap","re":true},"ev",{"VAR?":"weigher_attention"},1,"+",{"VAR=":"weigher_attention","re":true},"/ev",{"->":"chapter_15"},{"#f":5}],"c-2":["\n","ev",2,"/ev",{"VAR=":"salt_ledger_gap","re":true},"ev",{"VAR?":"weigher_attention"},1,"+",{"VAR=":"weigher_attention","re":true},"/ev",{"->":"chapter_16"},{"#f":5}]}],{"#f":1}],"chapter_06":[["#","^chapter: The Incomplete Record","/#","^Wren gathered the copied sheets with both hands, pressing them flat against her chest to stop their rustling. The docket was already folded inside her coat, a hard rectangle against her ribs. She did not cap her pen—there was no time—and left it rolling on the desk as she blew out the lamp.","\n","^The corridor was dark. She moved by memory, one hand on the wall, past the assessors' closed doors, past the framed portrait of the first Harbor Master that no one ever looked at. The back stair was narrower than the main, used by the charwomen and the watchman on his rounds. She took it downward, her boots finding the worn center of each step where a thousand boots had gone before.","\n","^The door at the bottom opened onto the alley behind the Customs House, where the fish-gut carts came in the morning. The smell hit her first, then the cold. The harbor fog had rolled in while she worked, and the lamplight from the quay was only a dull smear somewhere to her left. Wren pulled her collar up and walked, not running—running in fog drew eyes—and her hand kept moving to her coat to check that the docket was still there, that the folded sheets had not slipped.","\n","^She had eight quarters copied. Eight out of seventy-six. Enough to see the pattern, not enough to prove it to anyone who did not already know. The names of six clerks besides her own, each one a junior who had sat where she sat and copied the line and thought nothing of it. She tried to remember their faces and could not. The Customs House churned through clerks the way the harbor churned through tide.","\n","^Her lodging was two streets up from the water, above a chandlery that closed at dusk. She climbed the stairs with her boots in her hand so the landlady would not hear, though the landlady was deaf in one ear and pretended to be deaf in the other. The room was cold, the fire long dead. Wren lit her own lamp from the tinderbox and spread the sheets on the table by the window.","\n","^The fog moved past the glass like something breathing. She weighted the corners with her inkwell, her pen-case, the little stone her father had given her years ago that was supposed to bring a sailor home. The sheets made a ragged row. She had not copied the amounts—only the dates, the ship names, the clerk signatures, the seal notations. Even so, the pattern was unmistakable. Every quarter. The same hand placing the heron seal. The same ship that had been at the bottom of the sea since before Wren learned to write.","\n","^She took the docket from her coat and smoothed it on the table beside the sheets. The weigher's capitals. The looping _Cask_. The pencilled line underneath: _Tell O. the lamp is lit._","\n","^Someone knocked at the door below, two streets away, and Wren's hand went to her throat. But it was only a drunkard looking for the chandler's wife, or a sailor who had mistaken the door. The knock did not repeat. She sat with her palm flat on the copied sheets, feeling her own pulse through the paper, and listened until the footsteps went away.","\n","^Tomorrow night the ship would come in. Varga had said so. Wren had a day to decide what she was going to do with what she knew, and she did not have enough to do any of the things that felt like justice. She had enough to understand that she was part of it now—that her own hand, her own slanted sevens, had helped keep the lie alive for two years without her knowing.","\n","^The harbor bell rang the half-tide, muffled by fog. Wren left the sheets on the table and lay down on her bed in her coat, the docket still in the pocket, and watched the lamp flame shrink in the glass until it was no larger than the heron seal she saw when she closed her eyes.","\n","ev","str","^Lie down and plan the morning","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Walk to berth nine","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Find Varga and ask why","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["\n","ev",{"VAR?":"salt_ledger_gap"},1,"+",{"VAR=":"salt_ledger_gap","re":true},"/ev",{"->":"chapter_17"},{"#f":5}],"c-1":["\n","ev",{"VAR?":"salt_ledger_gap"},1,"+",{"VAR=":"salt_ledger_gap","re":true},"/ev","ev",{"VAR?":"tidewarden_lamp"},1,"+",{"VAR=":"tidewarden_lamp","re":true},"/ev",{"->":"chapter_18"},{"#f":5}],"c-2":["\n","ev",{"VAR?":"salt_ledger_gap"},1,"+",{"VAR=":"salt_ledger_gap","re":true},"/ev","ev",{"VAR?":"varga_relief"},1,"+",{"VAR=":"varga_relief","re":true},"/ev",{"->":"chapter_19"},{"#f":5}]}],{"#f":1}],"chapter_07":[["#","^chapter: The Hollow Wall","/#","^Wren gathered the copied sheets and the docket together, her hands steady now that the decision was made. The wall behind the ledger room's east shelf had a gap where the wainscoting met the floor, a cavity left by old heating pipes that had been removed before her time. She had noticed it months ago, dropping a pen nib and finding the space wide enough to swallow her hand. She had never put anything there until now.","\n","^She rolled the sheets tight, the docket nested inside like a seed, and slid the cylinder into the gap. It went easily, silent against brick and plaster dust. She pushed it deep, until her fingers grazed the back of the cavity and the roll was lost in darkness. Then she straightened the wainscoting with her palm, brushing away the pale dust that had marked her fingers. The gap looked like any other gap in an old building. The shelf above it held the same volumes, the same order, the same pretense that nothing had been disturbed.","\n","^She capped her pen and put it in her pocket. The open ledger she closed and returned to its place, the autumn quarter volume aligned with its neighbors by the worn leather at their spines. The desk was bare. Her lamp was out. She stood in the dark for three breaths, listening to the harbor bell, and then she slid the bolt back and opened the door.","\n","^The corridor was empty. The watchman's rounds had passed, or had not yet reached this wing; she did not know which, and it did not matter now. She walked with unhurried steps, the steps of a clerk who had stayed late to finish a reconciliation and was now going home to a cold supper and a colder bed. Her hands were empty. Her coat was flat against her sides. If the watchman turned his lamp her way, he would see a junior clerk with ink on her fingers and nothing else.","\n","^The harbor door opened onto the quay and the fog. It had come in while she worked, a grey tide thicker than the one that moved beneath the Customs House cellars. The lamps of the lower harbor were only smears of yellow, and the masts of the moored ships had lost their tops in the dark. Wren pulled her collar up and walked into it, her boots finding the cobbles by memory.","\n","^She did not go toward her lodging. Not yet. The night was whole before her, and somewhere in it the truth she had hidden was waiting to be claimed. The fog swallowed her footsteps. The harbor bell rang once, marking some turn of the tide she had not kept track of. She walked with empty hands and a full mind, the heron seal still visible when she blinked, and the ship that would come in tomorrow night moving toward Harrowmere through water she could not see.","\n","ev","str","^Go home and wait for morning","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Walk to berth nine","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Knock on Varga's door","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["^ ",{"->":"chapter_20"},"\n",{"#f":5}],"c-1":["^ ",{"->":"chapter_21"},"\n",{"#f":5}],"c-2":["^ ",{"->":"chapter_22"},"\n",{"#f":5}]}],{"#f":1}],"chapter_08":["#","^chapter: Walk to berth nine in the fog","/#","end",{"#f":1}],"chapter_09":["#","^chapter: Go home and write it down","/#","end",{"#f":1}],"chapter_10":["#","^chapter: Knock on Varga's office door","/#","end",{"#f":1}],"chapter_11":["#","^chapter: Go to the harbor wall","/#","end",{"#f":1}],"chapter_12":["#","^chapter: Walk to berth nine","/#","end",{"#f":1}],"chapter_13":["#","^chapter: Knock on Varga's door","/#","end",{"#f":1}],"chapter_14":[["#","^chapter: The Fog Carries Everything","/#","^The harbor door opened onto fog. Not the thin mist of autumn evenings but a true harbor fog, thick enough to swallow footsteps and deaden the bell buoys out on the Teeth. Wren pulled her collar up and stepped through, the roll of paper heavy against her side where she had tucked it inside her coat, tied with the blotter cord and pressing the docket's edge into her ribs.","\n","^The door clicked shut behind her. She did not look back. The north quay ran left toward the fish market and berth nine; the main harbor ran right, where the larger ships tied up and the watchman's lantern made a pale smear against the grey. She went left, keeping to the wall, her boots finding the gaps between cobbles by memory. The fog smelled of salt cod and cold stone and the particular damp of a tide that had turned without her noticing.","\n","^She had the complete record. Seventy-six quarters, every clerk's name, every heron seal, her own hand repeated across the years like a fingerprint she could not erase. The weight of it was physical. The roll shifted as she walked, and she found herself holding her elbow against it as if someone might try to take it from her, though the quay was empty and the fish market shuttered, the awnings furled and dripping.","\n","^A Tidewarden boat creaked at its mooring somewhere ahead. She could not see it yet, but she knew the sound: the short knock of a hull against fenders, the rattle of a shroud in a breeze too faint to feel. The Tidewardens kept their boats at berth nine, past the market, past the last of the working quay. Nobody brought a ship in there. The docket said otherwise. The docket bore the heron seal, and someone had written in pencil: _Tell O. the lamp is lit._","\n","^Wren stopped at the corner where the market ended and the quay narrowed. The fog was thicker here, or perhaps the lamps were fewer. She could see her own hand in front of her face, the fingers that had copied seventy-six entries and written three of the originals, but not much beyond. The sound of the boat was closer. Not moving—moored, waiting, occupied or empty she could not tell.","\n","^She thought of the plaque on the harbor wall, the one her father had shown her when she was small. Eleven men. O. Cask. The sea did this to people who were in a hurry. She had never been in a hurry before tonight. She had always been the clerk who went slowly, who checked twice, who believed that the reason was written down if you were willing to look.","\n","^Now she had looked, and the reason was in her coat, and the fog offered no advice about what to do with it. The tide whispered against the quay stones. Somewhere in the dark a lamp was lit, or would be lit, or had been lit for nineteen years while clerks like her copied the line and thought nothing of it.","\n","^She stood at the corner of the fish market with the complete record heavy against her ribs and the whole night still before her. The harbor bell began to count, distant and muffled, measuring something she could no longer name.","\n","ev","str","^Walk on to berth nine","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Go back for Varga","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Hide the roll and disappear","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["^ ",{"->":"chapter_23"},"\n",{"#f":5}],"c-1":["^ ",{"->":"chapter_24"},"\n",{"#f":5}],"c-2":["^ ",{"->":"chapter_25"},"\n",{"#f":5}]}],{"#f":1}],"chapter_15":[["#","^chapter: The Hidden Account","/#","^Wren pushed the roll deep into the cavity until her fingers grazed cold brick and the paper was lost to the dark. Seventy-six quarters, every clerk's name, her own slanted sevens repeated across nineteen years, the docket with its pencilled message nested inside like a seed. She straightened the wainscoting with her palm, brushing away the pale dust, and stepped back. The gap looked like any gap in an old building. The shelf above it held the same volumes in the same order. Nothing showed.","\n","^She capped her pen and put it in her pocket. The ledgers were closed, the desk bare, her lamp out. She stood in the dark for three breaths, listening to the harbor bell mark some fraction of the tide she had lost track of. Then she slid the bolt back and opened the door.","\n","^The corridor was empty. She walked with unhurried steps, the steps of a clerk who had stayed late to finish a reconciliation and was now going home to a cold supper. Her hands were empty. Her coat hung flat against her sides. If the watchman turned his lamp her way, he would see a junior clerk with ink on her fingers and nothing else.","\n","^The harbor door opened onto fog. It had come in while she worked, a grey tide thicker than the one that moved beneath the cellars. The lamps of the lower harbor were only smears of yellow, and the masts of the moored ships had lost their tops in the dark. Wren pulled her collar up and walked into it, her boots finding the cobbles by memory.","\n","^She had left the complete record behind. The thought came to her with each step, a rhythm underneath the harbor bell. Seventy-six quarters hidden in a wall, her own hand among them, the heron seal repeated like a pulse. If Varga went back to the ledger room—if she noticed the dust, the gap, the slight misalignment of a volume—she would find it all. Or if the watchman heard mice in the wall and called the porter. Or if the heating engineers returned after nineteen years to install new pipes. The reasons were written down, but they were no longer in Wren's hands.","\n","^She stopped at the corner where the main harbor met the north quay. The fog smelled of salt cod and cold stone. To her left the fish market was shuttered, the awnings furled and dripping; beyond it lay berth nine, where the Tidewardens kept their boats and the docket said the lamp was lit. To her right the larger ships tied up, their hulls creaking in the dark. Behind her, up the hill, Varga's rooms were above the chandlery, a single window that faced the harbor.","\n","^Her hands were empty. The complete record was in the wall, and the wall was in the Customs House, and the Customs House was behind her. She had preserved her deniability at the cost of her evidence. If someone stopped her now, she had nothing to show. If she needed to run, she could not take it with her. If she needed to bargain, she would have to go back.","\n","^The harbor bell began to count again, distant and muffled, measuring the tide that crept toward tomorrow night.","\n","ev","str","^Retreats to her lodging to wait out the night","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Follows the quay through fog toward berth nine","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Turns back for Varga's door above the chandlery","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["\n","ev",false,"/ev",{"VAR=":"has_evidence","re":true},"ev",2,"/ev",{"VAR=":"clerks_who_copied","re":true},"ev",3,"/ev",{"VAR=":"salt_ledger_gap","re":true},{"->":"chapter_26"},{"#f":5}],"c-1":["\n","ev",false,"/ev",{"VAR=":"has_evidence","re":true},"ev",2,"/ev",{"VAR=":"clerks_who_copied","re":true},"ev",3,"/ev",{"VAR=":"salt_ledger_gap","re":true},{"->":"chapter_27"},{"#f":5}],"c-2":["\n","ev",false,"/ev",{"VAR=":"has_evidence","re":true},"ev",2,"/ev",{"VAR=":"clerks_who_copied","re":true},"ev",3,"/ev",{"VAR=":"salt_ledger_gap","re":true},{"->":"chapter_28"},{"#f":5}]}],{"#f":1}],"chapter_16":[["#","^chapter: The Witness She Chose","/#","^Wren set the roll on the desk and sat down. The ledger lay open before her, the page where her own slanted sevens marched across the line for the _Margery Lane_, autumn quarter, two years past. She uncapped her pen and set it beside the blotter, the posture of a clerk who had never stopped working. The lamp burned low. The harbor bell counted the tide. She did not touch the roll. She did not look at the door.","\n","^The lock turned.","\n","^It was not the watchman's key — she knew the sound of his ring, the particular scrape of iron he made — but another key, one that moved more carefully, as if the hand that held it had all the time in the world. The door opened, and the lamplight from the corridor fell across the desk and the open ledger and the cylinder of paper tied with blotter cord.","\n","^Ilse Varga stood in the doorway. She wore her grey coat buttoned to the throat, and her hair was down, which Wren had never seen, a dark line across her shoulders. She looked at the desk, and then at Wren, and the silence between them was longer than any Wren had known in the Customs House.","\n","^\"You're still here,\" Varga said.","\n","^\"I'm behind.\"","\n","^\"You're never behind.\" Varga came into the room and closed the door behind her, the click of the latch loud in the stillness. She did not sit. She stood on the far side of the desk and looked down at the open page, at Wren's name in Wren's hand, at the roll of copied sheets with its ends fraying where the cord had bitten. \"You sat down to be found.\"","\n","^Wren said nothing.","\n","^\"Not by me.\" Varga's voice was quiet, the same quiet she used when she read a column of figures aloud and made the clerk wish for another trade. \"By the watchman. By someone who would have to report it. You wanted a witness.\"","\n","^\"I wanted it to be real.\"","\n","^\"It was real before tonight.\" Varga reached out and touched the roll with one finger, the heron ring catching the lamplight. \"Nineteen years, and you are the first who tried to make someone else see. The others copied the line and went home. Some of them noticed. None of them stayed.\"","\n","^\"You told me not to stop.\"","\n","^Varga's hand withdrew. She looked at Wren with an expression Wren could not read — something tired, something almost fond, something closed like a door she had learned to keep latched. \"I wondered,\" she said, \"whether that was a mistake.\"","\n","^Below them, the watchman's bell rang the hour. Varga did not move at the sound. She stood with her back to the door and the harbor fog pressing against the window glass, and Wren understood that she was not leaving, that she had come back to the Customs House in the middle of the night because she had known, or guessed, what Wren would choose.","\n","^\"The watchman will make his round again in twenty minutes,\" Varga said. \"He will find this door unlocked, and a junior clerk asleep at her desk, and nothing out of place. Or he will find you sitting here with seventy-six quarters of copied evidence and a docket that does not belong in your hand, and he will have to tell someone. The harbormaster. The magistrate. Me.\"","\n","^She paused. The lamplight flickered, a draft from the window or the corridor or the slow breathing of the building itself.","\n","^\"I cannot unfind you, Wren. I can only decide what happens next.\"","\n","^Wren looked at the roll on the desk, at her own name in the ledger, at the woman who had told her she saw what others skim. The harbor bell was still counting, measuring something that no longer felt like time.","\n","ev","str","^Tell Varga the watchman should hear this too","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Ask Varga why she kept the Margery Lane alive","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Push the roll across the desk to Varga","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["\n","ev",{"VAR?":"varga_relief"},1,"-",{"VAR=":"varga_relief","re":true},"/ev","ev",{"VAR?":"weigher_attention"},1,"+",{"VAR=":"weigher_attention","re":true},"/ev",{"->":"chapter_29"},{"#f":5}],"c-1":["\n","ev",{"VAR?":"varga_relief"},1,"+",{"VAR=":"varga_relief","re":true},"/ev",{"->":"chapter_30"},{"#f":5}],"c-2":["\n","ev",{"VAR?":"varga_relief"},1,"+",{"VAR=":"varga_relief","re":true},"/ev",{"->":"chapter_31"},{"#f":5}]}],{"#f":1}],"chapter_17":["#","^chapter: Lie down and plan the morning","/#","end",{"#f":1}],"chapter_18":["#","^chapter: Walk to berth nine","/#","end",{"#f":1}],"chapter_19":["#","^chapter: Find Varga and ask why","/#","end",{"#f":1}],"chapter_20":["#","^chapter: Go home and wait for morning","/#","end",{"#f":1}],"chapter_21":["#","^chapter: Walk to berth nine","/#","end",{"#f":1}],"chapter_22":["#","^chapter: Knock on Varga's door","/#","end",{"#f":1}],"chapter_23":[["#","^chapter: The Lamp Is Lit","/#","^Wren walked on.","\n","^The quay narrowed past the fish market, the cobbles giving way to older stone, slick with kelp and the residue of a thousand tides. The fog pressed close enough to taste, salt and cold and something else — lamp oil, perhaps, or the particular mustiness of a hull that had been in the water too long. She kept one hand on the warehouse wall to her left, her fingers finding the gaps between the granite blocks, her right arm clamped against the roll of paper inside her coat.","\n","^The sound of the boat grew sharper: not the creak of a vessel at rest but the purposeful small noises of someone aboard. A bucket knocked against a gunwale. A line ran through a block and was checked. Wren stopped where the wall ended and the open quay began, the last of the warehouse's shelter falling away from her shoulder like a dropped cloak.","\n","^Ahead, through the fog, she saw the light.","\n","^It was not the watchman's lantern, which moved and swung and cast a yellow bloom against the grey. This light was fixed, low, a single steady flame burning somewhere at the level of the quay itself. She thought of the pencilled message on the docket — _Tell O. the lamp is lit_ — and her breath caught in a way that had nothing to do with the cold.","\n","^Berth nine.","\n","^She had never been this far down the north quay. There was no reason for a clerk to come here, no cargo to inspect, no ledger to balance. The Tidewardens kept their boats at the quay's end, and the Customs House left them to it, a quiet territorial understanding older than the building where she worked. The lamp burned where no lamp should need to burn, at a berth where no ship ever came in.","\n","^Wren took three more steps. The fog thinned just enough to show her the shape of a small boat moored to the bollards, a Tidewarden craft by the cut of it, low in the water with a single mast stepped forward. The lamp sat on the quay beside it, not hung from a pole or housed in a lantern but set on the stone itself, a simple dish of oil with a wick, burning with a flame so steady it might have been tended moments ago.","\n","^There was no one visible. The boat rocked slightly, and Wren saw that its oars were in the locks, the painter made fast with a knot that could be slipped in a hurry. Ready. Waiting. The lamp was not a beacon for ships coming in from the Teeth — it was too low, too small, too easily missed in any weather but fog. It was a signal for someone already on the water, or for someone watching from the quay, a private language written in flame and darkness.","\n","^She thought of Varga in the cellar, her voice very quiet: _There is a ship coming in on tomorrow night's tide._ The lamp was lit tonight. The lamp had been lit, perhaps, for nineteen years, while clerks like her copied the line and thought nothing of it.","\n","^The fog shifted. A board creaked on the boat, and Wren froze, but it was only the tide moving through the hull, the ordinary respiration of a vessel at mooring. She was alone on the quay with the lamp and the boat and the complete record heavy against her ribs, seventy-six quarters of a truth that had kept itself burning in the dark.","\n","^The harbor bell rang once, distant, marking some hour she had lost track of. The flame did not flicker. Wren stood at the edge of berth nine with the fog around her and the tide whispering against the stone, and understood that she had found the living heart of the lie — not in the ledger room, not in the cellar boxes, but here, where the water met the quay and a single lamp said that someone was expected.","\n","ev","str","^Step into the lamplight","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Settle in to watch","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Move the lamp","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["^ ",{"->":"chapter_38"},"\n",{"#f":5}],"c-1":["^ ",{"->":"chapter_39"},"\n",{"#f":5}],"c-2":["^ ",{"->":"chapter_40"},"\n",{"#f":5}]}],{"#f":1}],"chapter_24":[["#","^chapter: The Cellar Reckoning","/#","^The fog was thicker going back. Wren kept her hand on the harbor wall until her fingers found the iron gate of the Customs House service entrance, the one the watchman used when he did not want to climb the front steps. It was unlocked, as it always was, and she passed through into the narrow passage that led to the cellars.","\n","^The corridor smelled of brine and lamp oil, the same cellar smell, but upstairs now, closer to where people worked and slept. She did not go to the ledger room. Varga would not be there. Wren went down, her boots finding the same stairs she had climbed an hour before, the roll of paper shifting against her ribs with each step.","\n","^The cellar door stood open. Lamplight moved on the wall beyond it, slow and steady, not the flicker of a draft but the deliberate motion of someone walking with a lamp held low. Wren stopped on the threshold.","\n","^Varga stood among the docket boxes with her back to the door. She had opened the autumn quarter box — the same box, the same gap near the bottom where the _Margery Lane_ docket had lain. Her grey coat hung straight to her heels. Her right hand, the one with the heron ring, rested on the crate's edge.","\n","^\"I took it,\" Wren said.","\n","^Varga did not turn. \"I know. I counted.\"","\n","^\"Then you know what else I have.\"","\n","^Varga's hand moved, a small gesture, nothing Wren could read. \"Seventy-six quarters. You copied them all. I wondered whether you would stop at your own name, or keep going until the hand that wrote the first one.\"","\n","^\"I kept going.\"","\n","^\"Yes.\" Varga turned. In the lamplight her face was the same face Wren had studied for three years — the slight asymmetry of her eyebrows, the way she held her mouth when she was deciding whether a mistake was worth mentioning — but the wear in it was deeper now, visible in a way that daylight and distance had always hidden. \"You would. That was the thing I could never predict, Wren. Whether your patience was a virtue or a trap you had set for yourself.\"","\n","^Wren came into the cellar. The water moved under the floor, the same whisper she had heard before, and she understood that Varga had come back here not to check on the docket but to wait. The open box, the counted files, the lamp held low — these were the preparations of someone who had already decided what she would say when the door opened.","\n","^\"Who is O.?\" Wren asked again.","\n","^\"Someone who pays what he owes.\" Varga's voice was quiet, the same quiet she used in the assessment room, but here in the cellar it did not carry the same weight. Here it sounded like a woman speaking to herself, testing whether the words still held. \"Someone who was on the _Margery Lane_ when she went out past the Teeth, and who came back when the others did not. Someone I promised that the harbor would not forget him, if he kept paying for the memory.\"","\n","^Wren felt the roll of paper against her side, seventy-six quarters of memory, her own hand among them. \"The plaque says eleven men.\"","\n","^\"The plaque says what the sea left.\" Varga looked at the open box, at the gap where the docket had been. \"O. Cask was the master. He was also the only one who could swim.\"","\n","^The cellar was very still. The harbor bell rang, distant and muffled, counting a tide that had turned while they stood there.","\n","^\"You have a choice,\" Varga said. \"You have always had a choice, from the moment you found the first entry. The others did not see, or they saw and chose not to understand. You understood. And now you must decide whether understanding is enough, or whether you need to be the one who ends it.\"","\n","^She stepped away from the crate. The lamplight fell between them, a bright space on the damp stone floor, and Wren saw that Varga's hands were empty, the heron ring catching the light, and that she had made no move to take the roll or close the box or call for the watchman. She was waiting. She had been waiting, perhaps, since the night nineteen years ago when she first pressed her seal into grey wax and gave a dead ship a reason to keep sailing.","\n","ev","str","^Ask why she chose this ship","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Ask who else knows","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Tell her the ledger must change","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["\n","ev",{"VAR?":"varga_relief"},1,"+",{"VAR=":"varga_relief","re":true},"/ev",{"->":"chapter_32"},{"#f":5}],"c-1":["\n","ev",{"VAR?":"salt_ledger_gap"},1,"+",{"VAR=":"salt_ledger_gap","re":true},"/ev",{"->":"chapter_33"},{"#f":5}],"c-2":["\n","ev",{"VAR?":"varga_relief"},1,"-",{"VAR=":"varga_relief","re":true},"/ev",{"->":"chapter_34"},{"#f":5}]}],{"#f":1}],"chapter_25":[["#","^chapter: The Disappearance","/#","^Wren did not walk on to berth nine. She did not turn back for the Customs House door. She went to the harbor wall, not to the plaque but to the iron bollards below it, where the fishing smacks used to tie up before the new quay was built. The third bollard from the end had a hollow core — she had pressed her ear to it as a child, listening to the tide echo inside the iron, and her father had laughed and told her the sea was talking back. She slid the roll into the hollow, pushing it deep where rust had flaked away and the darkness went further than her fingers could follow. The docket's edge caught, then released. She stood and walked away without looking back, her hands empty, her coat flat against her sides.","\n","^The fog took her. She walked inland, away from the quay, letting the cobbles guide her feet. Without the roll against her ribs she felt lighter than she should have, as if she had left her own heartbeat in the bollard along with the paper. Seventy-six quarters in the dark, her own slanted sevens among them, the heron seal repeated like a pulse. Let someone else find it. Let someone else ask.","\n","^The lanes narrowed. The salt cod smell faded, replaced by the inland smell of wet earth and closed bakeries. She was going to disappear. She would walk until the road forked toward the towns inland, until Harrowmere was a name she had left behind with the dead ship and the living lie. She would be the clerk who had vanished, another gap in the record that no one would think to question.","\n","^Then she saw the light.","\n","^It was not a street lamp. Those were yellow and steady, spaced along the quay at intervals she knew by heart. This light was white, faint, moving — a lantern on water, or on a deck, or in a hand. It came from the north, from beyond the fish market, from the direction of berth nine.","\n","^She stopped. The fog swallowed the light, then gave it back. Closer now, or further away — the fog made distance meaningless. But she knew what she was seeing. The lamp was lit. Someone had lit it, or someone was lighting it now, in answer to a message written in pencil on a docket nineteen years ago: *Tell O. the lamp is lit.*","\n","^The ship was not coming tomorrow night. The ship was already here.","\n","^Or someone was preparing for it. Or the lamp was always lit, had been lit for nineteen years, and she had simply never walked this way in fog thick enough to make it visible.","\n","^Wren stood at the edge of the inland road with the harbor behind her and the lamp ahead of her, and understood that she could not disappear while the light burned. The roll was safe in the bollard, or as safe as anything hidden in iron and rust could be. But she was still here, empty-handed, with the whole night before her and a light moving in the dark that said the lie was not finished with her yet.","\n","ev","str","^Walk toward the light","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Go to the weighing shed","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Find her way home through the fog","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["\n","ev",false,"/ev",{"VAR=":"has_evidence","re":true},{"->":"chapter_35"},{"#f":5}],"c-1":["\n","ev",false,"/ev",{"VAR=":"has_evidence","re":true},{"->":"chapter_36"},{"#f":5}],"c-2":["\n","ev",false,"/ev",{"VAR=":"has_evidence","re":true},{"->":"chapter_37"},{"#f":5}]}],{"#f":1}],"chapter_26":["#","^chapter: Retreats to her lodging to wait out the night","/#","end",{"#f":1}],"chapter_27":["#","^chapter: Follows the quay through fog toward berth nine","/#","end",{"#f":1}],"chapter_28":["#","^chapter: Turns back for Varga's door above the chandlery","/#","end",{"#f":1}],"chapter_29":["#","^chapter: Tell Varga the watchman should hear this too","/#","end",{"#f":1}],"chapter_30":["#","^chapter: Ask Varga why she kept the Margery Lane alive","/#","end",{"#f":1}],"chapter_31":["#","^chapter: Push the roll across the desk to Varga","/#","end",{"#f":1}],"chapter_32":["#","^chapter: Ask why she chose this ship","/#","end",{"#f":1}],"chapter_33":["#","^chapter: Ask who else knows","/#","end",{"#f":1}],"chapter_34":["#","^chapter: Tell her the ledger must change","/#","end",{"#f":1}],"chapter_35":["#","^chapter: Walk toward the light","/#","end",{"#f":1}],"chapter_36":["#","^chapter: Go to the weighing shed","/#","end",{"#f":1}],"chapter_37":["#","^chapter: Find her way home through the fog","/#","end",{"#f":1}],"chapter_38":[["#","^chapter: The Keeper's Name","/#","^Wren stepped into the lamplight.","\n","^The flame caught her first, the edge of her coat, her hands empty at her sides. She had walked out of the fog as if the quay belonged to clerks after midnight, as if berth nine were just another desk in a building that happened to float. The light was warm on her face after the cold of the warehouse wall. She felt exposed down to the bone, the roll of paper inside her coat suddenly obvious as a deformity, her own breathing too loud in the stillness.","\n","^The woman on the boat saw her immediately. Wren had not made a sound, but the keeper's head turned as if the lamplight itself had spoken, announcing a second shape where only one should stand. She was older than Wren had thought, or the fog had made her seem younger from a distance — fifty, perhaps, with the broad hands of someone who had rowed through more winters than Wren had lived. Her oilskins were mended at the shoulder with a different shade of canvas, the repair old enough to have softened at the edges.","\n","^\"You're not Customs,\" the woman said. Not a question, but not hostile either. A classification, the way a weigher might name a fish she had not expected in the net.","\n","^\"I'm a clerk.\" Wren's voice came out level, the same tone she used when Varga asked her to read a column aloud. \"I work the tithe desk.\"","\n","^The woman's hands stayed on the gunwale. She did not look toward the warehouse or the fog behind Wren, did not search for companions. Either she knew Wren was alone, or she had stopped caring who else might come.","\n","^\"The tithe desk.\" A pause. \"Then you've written the name.\"","\n","^Wren felt the words land. Not *copied* — *written*. The woman knew the distinction. She knew that someone sat in the ledger room and transferred the docket's lines into the Salt Ledger, that the hand changed every quarter but the name stayed the same. She knew that Wren's hand, with its slanted sevens and its crossed double-l, had carried the lie forward like all the others.","\n","^\"I've written it,\" Wren said. \"Tonight I found the lamp.\"","\n","^The woman looked at the flame between them, the small steady dish of light that had burned for nineteen years without appearing in any ledger. \"The lamp finds you,\" she said. \"Or it doesn't. You didn't come here because of the light.\"","\n","^\"I came because of the heron seal.\"","\n","^Something shifted in the woman's face — not recognition, but a settling, as if a weight she had carried on one shoulder had finally been allowed to drop. She stepped onto the quay, the boat rocking behind her, and stood at her full height, which was not much taller than Wren but seemed to occupy more space, more gravity, more of the night.","\n","^\"Master Assessor Varga,\" she said. \"She's the heron.\"","\n","^\"Yes.\"","\n","^\"And she knows you're here.\"","\n","^Wren thought of the cellar, Varga's voice very quiet: *There is a ship coming in on tomorrow night's tide.* She thought of the footsteps that had paused outside the ledger room door, the watchman who had listened and moved on.","\n","^\"She knows I found the entries,\" Wren said. \"She doesn't know I'm here.\"","\n","^The woman studied her for a long moment. The lamp burned between them, its flame steady as a held breath, and Wren understood that she was being measured against something — not the law, which had no voice at berth nine, but the patience of someone who had kept a secret through fog and winter and the indifference of nineteen years of clerks.","\n","^\"I'm Maren,\" the woman said at last. \"I keep the boats. I keep the lamp. I don't keep the ledger — that's Varga's work, and the clerks who write what they're told.\" She tilted her head, assessing. \"You're the first clerk who came to see what the writing meant.\"","\n","^\"I'm the first who asked.\"","\n","^\"Asking's different from coming.\" Maren's eyes went to Wren's coat, the place where the roll of paper pressed against the fabric. \"You've got something in there. More than curiosity.\"","\n","^Wren did not reach for the roll. To touch it now would be to declare herself, to transform from a clerk who had wandered into the fog into someone who had prepared for this meeting. She stood in the lamplight with Maren watching her, the boat creaking at its mooring, the tide whispering against the stone, and knew that the next thing she did would decide whether she left berth nine as a witness or as something else entirely.","\n","^The fog moved around them, indifferent to human names. The lamp burned on, saying without words that the arrangement held, that someone was expected, that the night was not yet finished with either of them.","\n","ev","str","^Unroll the copied record","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Ask who signs Cask on the dockets","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Step onto the boat","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["^ ",{"->":"chapter_47"},"\n",{"#f":5}],"c-1":["^ ",{"->":"chapter_48"},"\n",{"#f":5}],"c-2":["^ ",{"->":"chapter_49"},"\n",{"#f":5}]}],{"#f":1}],"chapter_39":[["#","^chapter: The Vigil","/#","^She chose the dark beside a stack of empty crab traps, settling where the warehouse wall met the quay at an angle that hid her from the lamp while letting her see both the flame and the boat. The fog clung to her hair and found the gaps in her collar. The roll of paper inside her coat pressed against her ribs whenever she breathed too deep, a reminder of why she was crouched on wet stone instead of asleep in her lodging.","\n","^Time moved differently at berth nine. The harbor bell rang twice, three times, each stroke muffled and directionless in the fog. The lamp burned on, its flame steady as a held breath, consuming oil at a rate Wren began to measure against the passing hours. Someone had filled it recently. Someone tended it.","\n","^The tide turned. She heard it in the change of the water against the quay, a shift from slap to suck, the boat rising slightly on its lines. Her legs ached. She shifted her weight by inches, her boots finding purchase on kelp-slick stone. The fog thinned and thickened without pattern, offering glimpses of the masthead, the empty quay, the black water beyond.","\n","^It was nearly the fourth bell when the figure came.","\n","^Wren saw the light first—a second lamp, moving, swinging in a hand that kept it low. The figure walked without hurry, a woman's shape in oilskins and a knitted cap, her boots making no sound on the stone. She went straight to the quayside lamp and knelt, checking the wick with a practiced motion, her face caught for a moment in the doubled light.","\n","^Wren knew her. She had seen her once on the quay, months ago, arguing with a weigher about a cargo of dried cod. A Tidewarden. Not one of the pilots who brought the big ships through the Teeth, but one of the boat-keepers, the ones who maintained the craft that carried the pilots out to waiting hulls. Her name was something common—Mara, Maren, a harbor name that Wren could not quite summon.","\n","^The woman did not look toward the crab traps. She finished with the lamp and stepped onto the boat, her weight settling it lower in the water. Wren heard her moving in the dark, a block shifting, a line being readied. Not departure preparations—not yet. The readiness of someone who expected to cast off on a signal, or at a particular hour, or when a particular shape emerged from the fog.","\n","^She emerged again and stood on the quay, facing the water, her back to Wren and the warehouse. The lamp beside her did not flicker. The fog moved through the space between them like a third presence, uncertain which side to settle on.","\n","^Wren understood the rhythm then, watching the woman's stillness. This was not a smuggler's nervous vigil, waiting for the watchman's round to pass. This was a duty, old and accepted, the kind of waiting that became its own form of patience. Nineteen years of tending a lamp that no official eye ever checked, of readying a boat that no ledger named, of standing in fog that swallowed everything except the knowledge that the arrangement held.","\n","^The woman checked the sky, though there was nothing to see but grey. She checked the boat again. She did not speak, did not whistle, did not make any sound that might carry across water. The silence was the signal. The silence and the lamp, burning where no lamp needed to burn, saying without words that berth nine was open and the Teeth would be guided.","\n","^Wren's knee throbbed where the stone pressed against it. She had been watching for hours, and she had learned what observation could teach: the face of one keeper, the readiness of one boat, the exact quality of light that said the arrangement lived. She did not know if a ship would come tonight, or if the lamp was lit every night, or if tomorrow's tide was the true appointment. She knew only that someone had kept this burning for nineteen years, and that the woman in oilskins had done it long enough to move without fear of discovery.","\n","^The fog thickened again, swallowing the boat, swallowing the woman's shape until she was only a darker patch against the dark, standing beside the steady flame. The harbor bell began to ring, distant and slow, counting an hour Wren had lost track of. She was cold deep in her chest, the kind of cold that came from stillness and damp and the weight of paper against her heart.","\n","^She could stay. She could wait for whatever the lamp summoned, and see it with her own eyes, and know the complete shape of the lie she had uncovered. She could step forward now, announce herself, ask the woman in oilskins what name she gave to the work she did. Or she could slip back into the fog the way she had come, carrying the complete record and the face of one keeper, and decide in a warmer place what justice looked like when it had been kept burning by patience rather than malice.","\n","ev","str","^She stayed in the dark and let the night finish what it started","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^She went back to the Customs House","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^She showed herself","/str","/ev",{"*":".^.c-2","flg":20},"ev","str","^Leave the copied roll at the foot of the lamp for the woman in oilskins to find","/str","/ev",{"*":".^.c-3","flg":20},{"c-0":["\n","ev",{"VAR?":"tidewarden_lamp"},2,"+",{"VAR=":"tidewarden_lamp","re":true},"/ev","ev",{"VAR?":"salt_ledger_gap"},1,"+",{"VAR=":"salt_ledger_gap","re":true},"/ev",{"->":"chapter_41"},{"#f":5}],"c-1":["^ ",{"->":"chapter_42"},"\n",{"#f":5}],"c-2":["\n","ev",{"VAR?":"weigher_attention"},1,"+",{"VAR=":"weigher_attention","re":true},"/ev",{"->":"chapter_43"},{"#f":5}],"c-3":["^ ",{"->":"chapter_59"},"\n",{"#f":5}]}],{"#f":1}],"chapter_40":[["#","^chapter: The Signal Answered","/#","^Wren crouched beside the lamp. The dish was warm against her palm, the oil barely rippling in its reservoir. She had expected something heavier, something that carried the weight of nineteen years, but it was only tin and cheap glass, the kind of lamp a weigher might use to read a docket in the dark. The wick was trimmed short, burning with a parsimony that suggested someone tended it regularly, someone who understood how long a quarter-inch of wick lasted in harbor fog.","\n","^She lifted the dish by its cool rim and set it down again three feet closer to the water, where the fog would catch the flame differently and the boat would see it from a changed angle. The light shifted. It caught the hull's planking instead of the quay, gilding the waterline where barnacles fretted the wood, and for a moment the boat looked like something emerging rather than something moored.","\n","^Then a board creaked, not the tide's random movement but a deliberate step, and a figure rose from the well where the mast stepped.","\n","^\"You're early.\"","\n","^The voice was a woman's, low and carrying, with the flattened vowels of the north quay. Wren could see nothing but a silhouette against the fog, a shape in oilskins with the breadth of shoulders that came from pulling oars through the Teeth. The figure did not move to the gunwale immediately. She stood in the well, watching the repositioned lamp, and Wren understood that she had disturbed a ritual whose steps were older than the Customs House.","\n","^\"The lamp's moved,\" the woman said. Not a question. She came to the rail with the easy balance of someone who had never known dry ground, her hands resting on the gunwale, her face still hidden. \"Who told you to move the lamp?\"","\n","^Wren's fingers found the roll of paper inside her coat, the cord still tied with the knot she had learned as a girl, binding her father's nets. She had the complete record. She had the docket with its pencilled message. She had moved the signal, and now someone who knew the old arrangement was asking who had given her permission.","\n","^The woman waited. Her hands did not leave the gunwale. Wren thought of the watchman's rounds, of Varga's footsteps in the cellar, of the seventy-six entries in her coat and the eleven names on the harbor plaque. Someone had to speak first, and whoever did would decide what this night became.","\n","ev","str","^Show her the docket","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Ask who O. is","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Admit I copied the records","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["^ ",{"->":"chapter_44"},"\n",{"#f":5}],"c-1":["\n","ev",{"VAR?":"tidewarden_lamp"},1,"+",{"VAR=":"tidewarden_lamp","re":true},"/ev",{"->":"chapter_45"},{"#f":5}],"c-2":["\n","ev",{"VAR?":"clerks_who_copied"},1,"+",{"VAR=":"clerks_who_copied","re":true},"/ev",{"->":"chapter_46"},{"#f":5}]}],{"#f":1}],"chapter_41":[["#","^chapter: The Night's Accounting","/#","^She stayed where she was.","\n","^The cold found every gap in her clothing, seeping through wool and linen until her skin felt like the stone she crouched on. Her right hand had gone numb from clamping the roll of paper against her ribs. She shifted by fractions of an inch, her breath shallow and white in the fog that still clung to the lower harbor.","\n","^Maren stood by the lamp without moving. The fog made a statue of her, oilskins dark against the dark, the knitted cap pulled low. She checked the boat once more, her hands finding the lines by touch, and then she settled against the bollard with the patience of someone who had waited through worse nights than this.","\n","^The tide came in. Wren heard it in the rising voice of the water, the boat lifting on its lines until the fenders compressed and released against the quay with a rhythm like breathing. The fog began to thin toward the east, not enough to show the sky but enough to change the quality of the dark from black to grey. She had been crouched beside the crab traps for hours. Her knee had passed through pain into a dull absence that would punish her later, when she tried to stand.","\n","^A gull called, early and lonely, the sound that meant the fishing fleet would soon be stirring. Maren lifted her head at it, a small motion, and checked the lamp again. The wick was burning lower now, the oil dish half-empty, and Wren saw her frown—a slight tightening of the face, there and gone—and look toward the harbor mouth where the Teeth waited under the lightening dark.","\n","^Nothing came. The boat stayed ready, the lamp stayed lit, and the woman stayed watching. But the sky continued to pale, the grey becoming the particular colour of a Harrowmere dawn, salt-tinged and reluctant, and Wren understood that whatever the lamp summoned, it had not come this night.","\n","^Maren moved at last. She pinched out the flame with bare fingers, a quick motion that spoke of long practice, and coiled the painter with the efficiency of someone who had done this a thousand times. The boat was not left ready now; it was secured, covered, made ordinary. The signal had been given, and the signal had not been answered, and the day would begin as all the other days had begun, with the lamp dark and the ledger waiting and no one the wiser.","\n","^She walked past Wren's hiding place without looking, close enough that Wren smelled the oilskins and the harbor on her, close enough to touch. Her boots found the gaps between the cobbles with the same soundless knowledge she had shown coming in. Then she was gone, around the corner where the warehouse wall ended, back toward the fish market and the waking harbor and the life that did not include signal lamps on empty quays.","\n","^Wren waited until the footsteps faded. She waited longer, until the gulls were crying in earnest and a cart rumbled somewhere on the upper quay, the first movement of a town that had slept through her vigil. Then she stood, her knee buckling, her fingers numb and clumsy as she steadied herself against the warehouse wall.","\n","^The lamp sat on the stone, cold now, a simple dish of oil with a blackened wick. The boat rocked at its mooring, secured and ordinary. The fog was lifting in rags, showing her the shape of the north quay, the fish market awnings, the distant masts of the main harbor where ships that existed in the ledger as well as the water tied up and paid their proper tithes.","\n","^She had watched through the night and learned this much: the arrangement was tended. The lamp was lit and the lamp was extinguished, and someone had done both with the patience of nineteen years. The ship had not come, or had not chosen to come, or had seen something from the water that Wren could not see from the quay. But the mechanism lived. The lamp was part of it, and Maren was part of it, and the boat that waited ready and was then secured was part of it, and the whole thing turned on a rhythm older than Wren's questions.","\n","^She had the complete record in her coat. She had the face of the keeper in her memory. She had the knowledge of how the signal worked, what it meant, that it was a living practice and not a dead forgery. The fog had given her that, and the cold, and the hours of stillness while the harbor turned toward morning.","\n","^The tide was going out now. She could see the waterline on the quay stones, the kelp draped and drying, the marks that the night had left behind. Today the ship would come, Varga had said. Tomorrow night's tide. But the lamp had been lit tonight, and tended, and extinguished at dawn, and that meant the arrangement had its own calendar, its own reasons, its own patient accounting that did not match the quarters of the Salt Ledger.","\n","^Wren walked back along the north quay with the roll of paper heavy against her side and the morning light finding its way through the thinning fog. Her boots were wet through. Her hands were stiff with cold. She had not slept, and she would not sleep, because today was the day she would have to decide what to do with a truth that kept its own hours and lit its own lamps in the dark.","\n","ev","str","^Find Varga before the harbor wakes","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Go home and hide the record","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Return to the ledger room and wait","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["\n","ev",{"VAR?":"tidewarden_lamp"},1,"+",{"VAR=":"tidewarden_lamp","re":true},"/ev","ev",true,"/ev",{"VAR=":"has_evidence","re":true},{"->":"chapter_50"},{"#f":5}],"c-1":["\n","ev",{"VAR?":"tidewarden_lamp"},1,"+",{"VAR=":"tidewarden_lamp","re":true},"/ev",{"->":"chapter_51"},{"#f":5}],"c-2":["\n","ev",{"VAR?":"tidewarden_lamp"},1,"+",{"VAR=":"tidewarden_lamp","re":true},"/ev","ev",false,"/ev",{"VAR=":"has_evidence","re":true},{"->":"chapter_52"},{"#f":5}]}],{"#f":1}],"chapter_42":[["#","^chapter: The Return","/#","^Wren went back.","\n","^The fog received her like a held breath, swallowing the quay behind her until berth nine was only a memory of lamplight and the shape of a woman in oilskins standing watch. She kept her hand on the warehouse walls, granite blocks giving way to timber siding, until the Customs House rose before her with its harbor door still unbolted from her departure. She slipped through and shot the bolt behind her, the sound deadened by the fog that had followed her in.","\n","^The corridor smelled of nothing but itself: old plaster, lamp oil from the sconces the watchman had trimmed, the particular silence of a building that had emptied hours ago and would not fill again for hours more. The roll of paper inside her coat had warmed to her body temperature, a cylinder of seventy-six quarters pressing against her ribs as if it were breathing.","\n","^She did not go to the cellars. Varga had found her there once already, and the cellar held the weight of water moving under the floor, the whispered admission that O. Cask had swum when eleven men had not. Wren climbed the main stair instead, her boots finding the worn center of each step where twenty years of clerks had walked before her. The ledger
