d taught her to see and was now watching to see what she would do with sight.","\n","ev","str","^Name the price of ending it","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Help me find the first docket","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Take me to berth nine","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["\n","ev",{"VAR?":"salt_ledger_gap"},1,"+",{"VAR=":"salt_ledger_gap","re":true},"/ev",{"->":"chapter_135"},{"#f":5}],"c-1":["\n","ev",{"VAR?":"varga_relief"},1,"+",{"VAR=":"varga_relief","re":true},"/ev",{"->":"chapter_136"},{"#f":5}],"c-2":["\n","ev",{"VAR?":"tidewarden_lamp"},1,"+",{"VAR=":"tidewarden_lamp","re":true},"/ev",{"->":"chapter_137"},{"#f":5}]}],{"#f":1}],"chapter_131":[["#","^chapter: The Withdrawal","/#","^Wren pulled her hand back.","\n","^The motion was small, a clerk's correction—ink still wet, a figure carried wrong, the pen lifted before the blotter took it. Her palm withdrew from the lamplight and settled against her own ribs, where the copied sheets had pressed earlier that night, where nothing pressed now but her own breathing.","\n","^Varga watched the empty space where Wren's hand had been. The heron ring remained in her open palm, still offered, still unclaimed, and the silence that followed was not the silence of relief but of a door left standing open in a draft, neither closed nor entered.","\n","^\"You pull back,\" Varga said slowly, \"but you do not stand.\"","\n","^Wren had no answer. The desk edge pressed against her, familiar, the same angle that had held her through three years of dockets and corrections and Varga's quiet approvals. She had reached for the ring and found her hand empty, and the emptiness was not failure—it was hesitation, the same hesitation that had kept her copying the Margery Lane's line three times without asking why. She had been careful. She had been thorough. She had not wanted to be wrong.","\n","^\"I don't know what I would be buying,\" Wren said.","\n","^\"No.\" Varga's hand closed, not into a fist this time but into something gentler, the fingers folding over the heron like a wing settling. \"You don't. And that is why I cannot give it to you. The ring is not a solution, Miss Adair. It is a continuation. You would take it believing you would end what I could not, and you would wake in nineteen years with grey beneath your eyes and a story you no longer believe, wondering who will sit across from you with their hand outstretched.\"","\n","^The stove had gone cold. The fog pressed against the window, erasing the harbor, the quay, the lamp at berth nine that burned for a ship that was not coming in any ordinary way. Wren sat in her chair and felt the distance between them shift—not wider, not narrower, but changed in quality, the way a column shifts when you discover the error was not in the addition but in the figure you carried forward from the line before.","\n","^\"I wanted it to be simple,\" Wren said. \"I wanted there to be a villain, or a victim. I wanted to take the ring and be the one who stopped it, or refuse the ring and be the one who exposed it. I wanted the columns to add up to something I could name.\"","\n","^\"They never do.\" Varga's voice was quiet, not unkind. \"That is the first lesson I should have taught you, and the one I learned too late. The ledger records what happened. It does not explain why. The balance shows that nothing is missing. It does not show that nothing should have been there in the first place.\"","\n","^She rose from her chair, slowly, the heavier step on her left foot that Wren had noticed a hundred times and never asked about. She moved to the window and stood with her back to the room, the grey coat buttoned to the throat, the heron ring hidden now in her closed hand.","\n","^\"I will tell you what I see when I look at you,\" Varga said, not turning. \"I see a clerk who has stopped copying without knowing what she will do instead. I see myself at twenty-four, before Cask stood on my mat, when I still believed that careful attention would be enough to keep me from harm. I see—\" She stopped. The fog moved against the glass, grey on grey, and her reflection was a ghost in it, older and more transparent than Wren had ever seen her. \"I see someone who will have to choose again, and again, and again, because that is what stopping means. It is not one moment. It is every quarter, every docket, every time the lamp is lit and you know it should not be.\"","\n","^Wren sat with her hand against her ribs and understood that Varga was not trying to persuade her anymore. The mentor was gone, or had never been real, or had been real and was now something else—a woman at a window, talking to her own reflection, offering warnings that she knew would not be heeded because she had not heeded them herself.","\n","^\"What will you do,\" Wren asked, \"if I walk out now?\"","\n","^Varga was quiet. The harbor bell rang, distant and slow, counting an hour that belonged to neither night nor morning. When she spoke, her voice had the quality of something already past, a record entered in a ledger that would not be reviewed until year-end.","\n","^\"I will wait,\" she said. \"I have always waited. For the docket, for the payment, for the clerk who would finally ask. I will sit at this desk, and I will press the seal when the docket comes, and I will tell myself that balance is still worth more than the truth I no longer remember how to speak. That is what I will do, Miss Adair. That is what I have always done.\"","\n","^She turned from the window. The lamplight caught her face, the grey beneath the eyes, the lines that nineteen years of balanced ledgers had drawn. She looked at Wren—really looked—and what Wren saw in her expression was not hope, not despair, but something more terrible: patience. The patience of the sea, which keeps its dead and does not hurry. The patience of a woman who had made her choice long ago and had learned to live inside it, quarter by quarter, seal by seal, waiting for someone to come who would not simply take her place but would finally, actually, end what she had begun.","\n","^\"The tide turns before dawn,\" Varga said. \"Whatever you do, you will do in darkness. That is the only gift I can give you now—the knowledge that the decision does not wait for morning. It never has.\"","\n","^Wren sat in her chair with her hand against her ribs and felt the weight of the unchosen path pressing down on her like the fog pressing on the glass. She had reached for the ring and pulled back. She had admitted her own hand in the ledger. She had heard Varga's confession and found it changed nothing, solved nothing, balanced nothing that she could name.","\n","^But she was still sitting. She was still listening. And the night was not over.","\n","ev","str","^Name who eats because of this","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Show me the first docket","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Walk out now","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["\n","ev",{"VAR?":"varga_relief"},1,"+",{"VAR=":"varga_relief","re":true},"/ev",{"->":"chapter_138"},{"#f":5}],"c-1":["\n","ev",{"VAR?":"salt_ledger_gap"},1,"+",{"VAR=":"salt_ledger_gap","re":true},"/ev",{"->":"chapter_139"},{"#f":5}],"c-2":["\n","ev",{"VAR?":"varga_relief"},1,"-",{"VAR=":"varga_relief","re":true},"/ev","ev",false,"/ev",{"VAR=":"has_evidence","re":true},{"->":"chapter_140"},{"#f":5}]}],{"#f":1}],"chapter_132":["#","^chapter: Close your hand on the ring","/#","end",{"#f":1}],"chapter_133":["#","^chapter: Draw back your hand","/#","end",{"#f":1}],"chapter_134":["#","^chapter: Ask about the seventy-seventh quarter","/#","end",{"#f":1}],"chapter_135":["#","^chapter: Name the price of ending it","/#","end",{"#f":1}],"chapter_136":["#","^chapter: Help me find the first docket","/#","end",{"#f":1}],"chapter_137":["#","^chapter: Take me to berth nine","/#","end",{"#f":1}],"chapter_138":["#","^chapter: Name who eats because of this","/#","end",{"#f":1}],"chapter_13 <script>
(function () {
  var data = JSON.parse(document.getElementById('story-json').textContent);
  var meta = JSON.parse(document.getElementById('story-meta').textContent);
  var story = new inkjs.Story(data);
  var out = document.getElementById('story');
  var saveKey = 'ink-save:' + meta.id;

  function inline(text) {
    var html = text.replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; });
    return html
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
      .replace(/(^|\W)_([^_\s][^_]*)_(?=\W|$)/g, '$1<em>$2</em>');
  }
  function add(tag, html, className) {
    var element = document.createElement(tag);
    if (html !== null) element.innerHTML = html;
    if (className) element.className = className;
    out.appendChild(element);
    return element;
  }
  function tagValue(tags, name) {
    for (var i = 0; i < tags.length; i++) {
      var match = new RegExp('^\\s*' + name + '\\s*:\\s*(.*)$').exec(tags[i]);
      if (match) return match[1];
    }
    return null;
  }
  function run() {
    var first = null;
    while (story.canContinue) {
      var line = story.Continue().trim();
      var tags = story.currentTags || [];
      var chapter = tagValue(tags, 'chapter');
      if (chapter !== null) first = first || add('h2', inline(chapter));
      if (tags.some(function (t) { return /^\s*break\s*$/.test(t); })) add('hr', null);
      if (line === '') continue;
      var heading = /^#{1,6}\s+(.*)$/.exec(line);
      var element = heading ? add('h2', inline(heading[1])) : add('p', inline(line));
      first = first || element;
    }
    var list = add('ul', null, 'choices');
    story.currentChoices.forEach(function (choice) {
      var item = document.createElement('li');
      var button = document.createElement('button');
      button.textContent = choice.text;
      button.addEventListener('click', function () {
        list.remove();
        add('p', inline(choice.text), 'chosen');
        story.ChooseChoiceIndex(choice.index);
        save();
        run();
      });
      item.appendChild(button);
      list.appendChild(item);
    });
    if (story.currentChoices.length === 0) {
      list.remove();
      add('p', 'The end.', 'end');
    }
    if (first) { first.setAttribute('tabindex', '-1'); first.focus({ preventScroll: true }); first.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
  }
  function save() {
    try { localStorage.setItem(saveKey, JSON.stringify({ state: story.state.toJson(), html: out.innerHTML })); } catch (e) {}
  }
  function restart() {
    try { localStorage.removeItem(saveKey); } catch (e) {}
    story.ResetState();
    out.innerHTML = '';
    run();
  }
  document.getElementById('restart').addEventListener('click', restart);
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(saveKey) || 'null'); } catch (e) {}
  if (saved && saved.state) {
    try {
      story.state.LoadJson(saved.state);
      out.innerHTML = saved.html.replace(/<ul class="choices">[\s\S]*$/, '').replace(/<p class="end">The end\.<\/p>$/, '');
      run();
      return;
    } catch (e) { story.ResetState(); out.innerHTML = ''; }
  }
  run();
})();
</script>
