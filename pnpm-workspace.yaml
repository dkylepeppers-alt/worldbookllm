packages:
  - 'apps/*'
  - 'packages/*'

# Versions shared by several workspace packages; reference them as
# "catalog:" in package.json so every package moves together.
catalog:
  '@types/node': ^24.19.0
  '@vitest/coverage-v8': ^5.0.2
  # Exact: the server compiles ink to JSON that the web's runtime plays, so both
  # must read the same story format (ADR 0027).
  inkjs: 2.3.2
  typescript: ^6.0.3
  vitest: ^5.0.2
  zod: ^4.6.5

# Keep every copy of the Node types on the runtime's major (.nvmrc), including
# ones pulled in transitively or as optional peers (@types/better-sqlite3, vite).
overrides:
  '@types/node': 'catalog:'

# Dependencies allowed to run install scripts; pnpm blocks all others, and
# strictDepBuilds makes a new unapproved one fail the install instead of
# being skipped with a warning. better-sqlite3 fetches or compiles its native
# addon; esbuild installs its platform binary. sharp ships prebuilt optional
# packages and needs no entry.
allowBuilds:
  better-sqlite3: true
  esbuild: true
strictDepBuilds: true
