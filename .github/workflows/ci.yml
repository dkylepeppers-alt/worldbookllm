name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check lockfile for duplicate packages
        run: pnpm dedupe --check

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check for unused files, exports and dependencies
        run: pnpm knip

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          # Only push to main is trusted with the live key: pull_request runs
          # same-repo branch code (not just forks) with repo secrets attached,
          # so exposing it there would let any PR branch exfiltrate or spend it.
          SMOKE_NANOGPT_KEY: ${{ github.event_name == 'push' && secrets.NANO || '' }}

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        working-directory: apps/e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        run: pnpm --filter @worldbookllm/e2e exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm --filter @worldbookllm/e2e test:e2e
        env:
          # Only push to main is trusted with the live key: pull_request runs
          # same-repo branch code (not just forks) with repo secrets attached,
          # so exposing it there would let any PR branch exfiltrate or spend it.
          SMOKE_NANOGPT_KEY: ${{ github.event_name == 'push' && secrets.NANO || '' }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: worldbookllm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container
        run: |
          docker run -d --name wb -p 3001:3001 worldbookllm:ci

          # Wait for Docker's own HEALTHCHECK, so the check itself is covered.
          for _ in $(seq 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' wb)
            [ "$status" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' wb)" = true ] || break
            sleep 2
          done
          docker logs wb
          [ "$status" = healthy ] || { echo "container is $status"; exit 1; }

          test "$(docker exec wb id -un)" = node
          curl -fsS http://127.0.0.1:3001/api/health
          curl -fsS -o /dev/null http://127.0.0.1:3001/
          # Creating a book runs the story CLI and writes to /data as node.
          curl -fsS -X POST http://127.0.0.1:3001/api/books \
            -H 'content-type: application/json' -d '{"title":"CI smoke"}'

          # SIGTERM should close the server at once, not after the 10 s kill.
          start=$(date +%s)
          docker stop wb
          elapsed=$(( $(date +%s) - start ))
          exit_code=$(docker inspect -f '{{.State.ExitCode}}' wb)
          echo "stopped in ${elapsed}s with exit code ${exit_code}"
          [ "$exit_code" = 0 ] && [ "$elapsed" -lt 5 ]
